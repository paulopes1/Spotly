version: "3.8"

# Sobe apenas a infraestrutura (PostgreSQL). Frontend e backend rodam com
# `npm run dev` localmente — ver README.md.
services:
  db:
    image: postgres:16-alpine
    container_name: spotly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotly
      POSTGRES_PASSWORD: spotly
      POSTGRES_DB: spotly
    ports:
      - "5432:5432"
    volumes:
      - spotly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spotly_pgdata:
